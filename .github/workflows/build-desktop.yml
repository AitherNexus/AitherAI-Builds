name: Build and publish Aither AI desktop releases

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aither-ai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      already_released: ${{ steps.check.outputs.already_released }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read app version
        shell: bash
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - id: check
        name: Check whether this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Skipping rebuild."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: npm run build -- --win nsis-web --publish never
            artifact: dist/*
          - platform: macos
            os: macos-latest
            command: npm run build -- --mac --publish never
            artifact: dist/*.dmg
          - platform: linux
            os: ubuntu-latest
            command: npm run build -- --linux --publish never
            artifact: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the published GitLab app snapshot
        shell: bash
        run: |
          test -s source/index.html
          test -s source/app.js
          test -s source/style.css
          test -s source/config.js
          test -s source/api.js
          mkdir -p desktop/app
          cp source/index.html source/app.js source/style.css source/config.js source/api.js desktop/app/
          echo "Staged Aither AI version ${{ needs.prepare.outputs.version }}"
          ls -lah desktop/app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Configure small Windows web installer
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.build.nsisWeb={}; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n');"
      - name: Build installer
        working-directory: desktop
        run: ${{ matrix.command }}
      - name: Upload installer for release publishing
        uses: actions/upload-artifact@v4
        with:
          name: aither-ai-${{ matrix.platform }}
          path: desktop/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: aither-ai-*
          path: release-files
          merge-multiple: true
      - name: Publish permanent versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Aither AI ${{ needs.prepare.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
          make_latest: true
